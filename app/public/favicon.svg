<!--
  The same sprout as the PWA icons, as vectors — this is the favicon modern
  browsers pick when it's offered, and it stays crisp on any display.

  The geometry mirrors scripts/gen-icons.mjs exactly, in a 0..100 box where
  that script works in 0..1: the plate's 22% corner radius, the stem from 42%
  to 82% of the height, and two leaf ellipses (rx 17, ry 8.5) rotated ±0.7 rad
  = ±40.1°. Change one, change the other, and compare them side by side.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Indigene">
  <rect width="100" height="100" rx="22" fill="#1f6b3b" />
  <rect x="47" y="42" width="6" height="40" fill="#7ac28c" />
  <ellipse cx="36" cy="44" rx="17" ry="8.5" fill="#a7e0b5" transform="rotate(-40.1 36 44)" />
  <ellipse cx="64" cy="44" rx="17" ry="8.5" fill="#a7e0b5" transform="rotate(40.1 64 44)" />
</svg>
