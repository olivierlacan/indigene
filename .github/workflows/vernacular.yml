# Verify the localized plant & animal names against the national reference lists
# they claim to come from, and open a PR when the snapshot changes.
#
# A name in another language is *looked up*, not translated — see
# `app/src/lib/names.ts` — and it is looked up in the reference lists of a
# *country*: the French edition is fr-FR, so the lists are France's. The lookup
# needs open internet (TAXREF, Tela Botanica and Wikidata all refuse the local
# build sandbox's egress), which is exactly the situation `reconcile.yml` is in,
# so it gets the same treatment: a separate job, on a GitHub runner, producing a
# reviewable data change rather than a build artifact.
#
# What it catches, in order of how much it matters:
#   1. **A disagreement** — we display a name its own source doesn't back. That
#      fails the job, because it means the app is asserting something untrue.
#   2. **A silent authority** — a list that answered none of its lookups. Also a
#      failure when it's the national reference: a check that has stopped
#      checking looks exactly like a clean bill of health otherwise.
#   3. **A row still awaiting an fr-FR source** — the North American names
#      inherited from the Canadian list. Not a failure; the run proposes the
#      source to promote each one to.
#   4. **A gap upstream has filled** — a reference list has since named a taxon
#      we show in Latin. Not a failure; a suggestion, reported in the PR.
#   5. **Drift** — a name the authority has revised. Shows up in the committed
#      snapshot's diff.
#
# Quarterly, because vernacular names in a national référentiel move on the
# timescale of taxonomic revisions, not weeks.
name: Verify vernacular names

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Which locale's name table to verify"
        type: choice
        default: fr
        options:
          - fr
  schedule:
    - cron: "0 7 15 1,4,7,10 *" # 07:00 UTC on the 15th, quarterly

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vernacular-names
  cancel-in-progress: false

jobs:
  verify:
    name: Ask each reference list
    runs-on: ubuntu-latest
    env:
      LANG_CODE: ${{ inputs.lang || 'fr' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # the scripts run through Vite, not Node's TS support
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # continue-on-error so a disagreement still produces the snapshot and the
      # PR — a reviewer needs to see *what* disagreed, not just that something
      # did. The check step below re-reads the result and fails the job.
      - name: Check names against TAXREF, Tela Botanica and Wikidata
        id: check
        continue-on-error: true
        working-directory: app
        run: npm run names:check -- --lang "$LANG_CODE" | tee "$RUNNER_TEMP/vernacular.txt"

      - name: Read the report
        id: report
        if: always()
        run: |
          {
            echo "text<<REPORT_EOF"
            cat "$RUNNER_TEMP/vernacular.txt" 2>/dev/null || echo "_(no report written)_"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      # See reconcile.yml for why this is continue-on-error: the branch is
      # pushed either way, and opening the PR automatically needs "Allow GitHub
      # Actions to create and approve pull requests" in the repo settings.
      - name: Open a PR with the refreshed snapshot
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: names/verify
          title: "Re-verify vernacular names against the national reference lists"
          commit-message: "Refresh the vernacular-name verification snapshot"
          body: |
            Quarterly re-check of the localized plant and animal names in
            `app/src/locales/taxa.*.ts` against the lists they're asserted from.
            The French edition is **fr-FR**, so the lists are France's: TAXREF
            (INPN/MNHN), Tela Botanica (BDTFX/NVJFL), and Wikidata.

            A **disagreement** means the app is displaying a name its own source
            doesn't back: fix `taxa.*.ts`, don't paper over it. A **silent
            authority** (`!!` in the report) means a list answered nothing at
            all — fix the lookup, don't read it as "nobody has named these".
            **Pending** rows are the North American names inherited from the
            Canadian list, each printed with the source to promote it to. A
            **gap** is a taxon a reference list has since named that we still
            show in Latin — worth adding, and never urgent.

            ```
            ${{ steps.report.outputs.text }}
            ```

            🤖 Generated with [Claude Code](https://claude.com/claude-code)

      - name: Fail if any name disagrees with its source
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::At least one displayed name is not backed by the source it cites."
          exit 1
