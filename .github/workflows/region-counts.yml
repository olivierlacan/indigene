# Refresh the per-region iNaturalist record counts the app ships with, and open
# a PR with the result.
#
# These numbers answer "how often has this plant been recorded across this whole
# ecoregion?" for the readers who never gave a spot — someone who picked their
# region from a list, and the "Where it's native" lookup. See
# `app/scripts/build-region-counts.mjs` for why they're a coarser answer to a
# different question than the 50 km circle, and why they're taken over all time.
#
# It's a SEPARATE job from the Pages deploy, for the same reason the registry
# reconcile is: the deploy build stays hermetic. This only produces a data
# change (src/data/region-counts.ts), which a human reviews and merges; the
# normal build then ships it.
#
# Monthly, because counts drift by a percent or two a month and the app prints
# the date it took them. No API key: iNaturalist's v1 endpoints answer anonymous
# GETs, and this makes two requests per region.
#
# Requires "Allow GitHub Actions to create and approve pull requests" in the
# repo's Actions settings.
name: Refresh region record counts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Look up and report, but don't write or open a PR"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 15 * *" # 06:00 UTC on the 15th, monthly

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: region-counts
  cancel-in-progress: false

jobs:
  counts:
    name: Recount, rebuild & open a PR
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # the scripts run via Vite, not Node's TS support
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Count each region's natives
        working-directory: app
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run region-counts -- "${args[@]}"

      # The counts are typed data the app imports, so a bad refresh has to fail
      # here rather than at deploy time.
      - name: Typecheck the regenerated data
        if: env.DRY_RUN != 'true'
        working-directory: app
        run: npm run typecheck

      # continue-on-error for the same reason as the reconcile workflow: a
      # blocked PR-creation shouldn't red-fail a run whose branch was pushed.
      - name: Open a PR with the refreshed counts
        id: cpr
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/region-counts
          title: "Refresh region record counts"
          commit-message: "Refresh region record counts from iNaturalist"
          body: |
            Monthly refresh of `app/src/data/region-counts.ts` — how often each
            region's natives have been recorded inside that region's coverage
            box, and the all-plants yardstick they're read against.

            The diff should be numbers going up. A count that **falls sharply**,
            or a region whose yardstick moves by a lot, is worth a look before
            merging: it usually means a taxonomic change moved records to a
            different taxon id, not that a plant vanished.

            Taken over all time, anonymously, two requests per region. Merging
            this ships the new numbers with the next deploy; the app prints the
            date they were taken.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          # Labelled away on purpose, unlike the reconcile PR: that one can give
          # a whole region a working sightings section, while this only moves
          # numbers the app already showed.
          labels: skip-changelog
          add-paths: |
            app/src/data/region-counts.ts

      - name: Say where the PR is
        if: always()
        run: |
          echo "PR: ${{ steps.cpr.outputs.pull-request-url || 'none opened' }}" >> "$GITHUB_STEP_SUMMARY"
