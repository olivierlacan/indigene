# Deploys the PWA (app/) to GitHub Pages on every push to main.
#
# The app is fully client-side — it talks to SoilGrids, USGS, and Open-Meteo
# straight from the browser — so Pages hosts the entire product for free.
# The optional Ruby API (server/) is not deployed here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # `npm run build` also runs `tsc --noEmit`, so type errors block deploys.
      # The site lives at the root of its own domain (indigene.app), so built
      # URLs are root-absolute. This used to read configure-pages' `base_path`,
      # which resolves to /indigene on a project Pages site — those URLs 404 on
      # the custom domain, because the files sit at /assets, not /indigene/assets.
      # Hardcoding the root keeps the build honest whatever that API reports.
      - name: Build the app
        working-directory: app
        env:
          BASE_PATH: /
        run: npm run build

      # The public "What's new" page is compiled from the repo's CHANGELOG.md
      # (see the rules at the top of that file). It lands in dist/ before the
      # artifact upload, so notes republish on every merge that touched the
      # changelog. A malformed changelog fails the deploy here, loudly.
      - name: Build release notes from CHANGELOG.md
        working-directory: app
        run: npm run release-notes

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
