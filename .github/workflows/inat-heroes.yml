# Give every plant and animal nobody has reviewed yet iNaturalist's own
# photograph.
#
# `hero-photos.yml` is the *reviewed* tier: a shortlist a human picks from, so
# nothing it writes reaches the app on its own. This is the floor under it —
# `npm run hero:inat` stores the photo each taxon page opens with, in
# `app/src/data/inat-heroes.json`, for every subject with no reviewed pick.
# It used to be run by hand, and a whole region (Kantō) once shipped without
# it: 59 plants with the drawing where a photograph should be.
#
# **On a pull request** that changes a list it reads from, it commits the
# photos to that PR's own branch, so they arrive with the plants they belong
# to and nobody has a second PR to merge. A PR from a fork can't be pushed to;
# its run says so in the summary and the weekly run picks the gap up later.
#
# **Weekly, or by hand,** it fills whatever is still missing on main (a taxon
# whose first republishable photo appeared since) and opens a PR for that.
#
# It only fills gaps: one request per 30 subjects, no image downloads, about a
# minute. A run with nothing new changes nothing and pushes nothing.
#
# A commit pushed with the default token doesn't start other workflows, so the
# PR's checks don't re-run on it — which is why this one typechecks and tests
# before it pushes. Add a `HERO_BOT_TOKEN` secret (a fine-grained PAT with
# contents: write) and its pushes re-run CI like anyone's.
name: Fill iNaturalist hero photos

on:
  pull_request:
    paths:
      - app/src/data/registry.ts
      - app/src/data/plants.*.ts
      - app/src/data/wildlife.ts
      - app/src/data/lookalikes.ts
      - app/src/data/alternatives.ts
      - app/src/data/invasives.ts
      # A reviewed pick removed leaves a gap this tier should fill.
      - app/src/data/hero-photos.json
      - app/src/data/wildlife-photos.json
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC Mondays

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One run per PR; a newer push to the PR supersedes an older run.
  group: inat-heroes-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every file `hero:inat` and `hero:colors` can write.
  OUTPUTS: >-
    app/src/data/inat-heroes.json
    app/src/data/inat-lookalikes.json
    app/src/data/inat-alternatives.json
    app/src/data/inat-invasives.json
    app/src/data/hero-photos.json
    app/src/data/wildlife-photos.json
    app/src/data/plant-photos.json
    docs/hero-photos/needs-review.json

jobs:
  fill:
    name: Fill gaps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ON_PR: ${{ github.event_name == 'pull_request' }}
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Note a fork PR
        if: env.FORK == 'true'
        run: echo "PR from a fork — can't push photos to it; the weekly run will fill them after merge." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.FORK != 'true'
        with:
          # On a PR, the branch itself (not the merge commit), so we can push.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.HERO_BOT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: env.FORK != 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: env.FORK != 'true'
        working-directory: app
        run: npm ci

      - name: Ask iNaturalist for the missing photographs
        if: env.FORK != 'true'
        working-directory: app
        shell: bash # explicit, so pipefail is on and tee can't hide a failure
        run: npm run hero:inat | tee "$RUNNER_TEMP/heroes.log"

      # Loud on purpose. A subject whose iNaturalist pick we can't republish
      # shows a drawing until a person chooses a photo, so a PR that brings one
      # in says so where its author and reviewers look: a pinned comment, a
      # warning on this check, and the run summary.
      - name: Photos nobody chose
        id: queue
        if: env.ON_PR == 'true' && env.FORK != 'true'
        working-directory: app
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:docs/hero-photos/needs-review.json" > "$RUNNER_TEMP/base-queue.json" 2>/dev/null \
            || echo '{"subjects":[]}' > "$RUNNER_TEMP/base-queue.json"
          node scripts/needs-review-report.mjs "$RUNNER_TEMP/base-queue.json" ../docs/hero-photos/needs-review.json \
            > "$RUNNER_TEMP/queue.md"
          cat "$RUNNER_TEMP/queue.md" >> "$GITHUB_STEP_SUMMARY"
          added=$(grep -o 'added=[0-9]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          # One pinned comment, edited in place on every run.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- needs-review -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/queue.md" > /dev/null
          elif [ "${added:-0}" -gt 0 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/queue.md" > /dev/null
          fi
          if [ "${added:-0}" -gt 0 ]; then
            echo "::warning title=Photos nobody chose::$added subject(s) in this PR will show a drawing until someone picks a photo — see the PR comment."
          fi

      - name: Anything new?
        id: diff
        if: env.FORK != 'true'
        run: |
          if git diff --quiet -- $OUTPUTS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # hero:colors averages each new photo in Chromium for the placeholder
      # tint; it skips every photo that already has one.
      - name: Install Chromium
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Colour the new photographs
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        run: npm run hero:colors

      - name: Typecheck and test with the new data
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        run: |
          npm run typecheck
          npm test

      - name: Commit to the PR
        if: steps.diff.outputs.changed == 'true' && env.ON_PR == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $OUTPUTS
          git commit -m "Fill iNaturalist hero photos for this PR's new subjects"
          # The author may have pushed while this ran: replay our one commit on
          # top of theirs rather than lose either.
          git push origin "HEAD:$BRANCH" || {
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          }
          echo "Pushed the new photographs to \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always() && env.FORK != 'true'
        run: |
          # `cat`, never an interpolated expression: the log carries names that
          # came back from an external API.
          {
            echo "### iNaturalist hero photos"
            echo ""
            echo '```'
            tail -n 30 "$RUNNER_TEMP/heroes.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Off a PR there's no branch to join, so the gap gets one of its own.
      # continue-on-error so a blocked PR-creation doesn't red-fail a run whose
      # branch was pushed.
      - name: Open a PR with the new photographs
        id: cpr
        if: steps.diff.outputs.changed == 'true' && env.ON_PR != 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/inat-heroes
          title: "Fill iNaturalist hero photos"
          commit-message: "Fill iNaturalist hero photos for unreviewed subjects"
          body: |
            Fills `inat-heroes.json` (and its look-alike, ornamental and
            invasive siblings) for every subject that has no reviewed photo
            and no stored one yet. Each is the photograph iNaturalist's own
            taxon page opens with — never another photo from its gallery.

            Subjects whose chosen photo can't be republished keep their
            drawing and are listed in `docs/hero-photos/needs-review.json`
            for a person to pick (`npm run hero:harvest -- --queue`, then
            `npm run hero:review`).

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          # The change a reader notices (a new region, a new animal) carries
          # its own changelog entry; this fills in its pictures.
          labels: skip-changelog
          add-paths: |
            docs/hero-photos/needs-review.json
            app/src/data/inat-heroes.json
            app/src/data/inat-lookalikes.json
            app/src/data/inat-alternatives.json
            app/src/data/inat-invasives.json
            app/src/data/hero-photos.json
            app/src/data/wildlife-photos.json
            app/src/data/plant-photos.json

      - name: Say where the PR is
        if: steps.cpr.outcome != 'skipped' && env.ON_PR != 'true'
        run: |
          echo "PR: ${{ steps.cpr.outputs.pull-request-url || 'none opened' }}" >> "$GITHUB_STEP_SUMMARY"
