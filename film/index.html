<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indigene — the film</title>
<style>
  @font-face { font-family: "Roboto"; src: url(assets/fonts/Roboto.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Caveat"; src: url(assets/fonts/Caveat.woff2) format("woff2"); font-weight: 400 700; font-display: block; }
  :root { --bg: #14160f; --ink: #f2f1e8; --brand: #7ec894; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Roboto, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #f7f5ef; box-shadow: 0 10px 50px rgba(0,0,0,.45); }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px; display: flex; gap: 14px; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.55)); opacity: 0; transition: opacity .3s; }
  body:hover #ui, body.paused #ui { opacity: 1; }
  button { font: 600 15px Roboto, system-ui; color: #082b16; background: var(--brand); border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--brand); }
  #time { font: 500 14px/1 Roboto, system-ui; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,22,15,.35); cursor: pointer; }
  #start span { font: 700 22px Roboto, system-ui; background: var(--brand); color: #082b16; padding: 16px 30px; border-radius: 999px; }
  body.capture #ui, body.capture #start { display: none; }
  body.capture canvas { width: 1920px; height: 1080px; box-shadow: none; }
  body.capture #stage { place-items: start; }
</style>
</head>
<body class="paused">
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><span>▶ Play with sound</span></div>
<div id="ui">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" />
  <span id="time">0.00 / 60.00</span>
</div>
<audio id="audio" src="assets/soundtrack.m4a" preload="auto"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
