# Checks that a list's Sort, Group and Filter controls keep the reader's place.
#
# Each of those controls redraws the page it's on, and the control the reader
# tapped has to stay under their finger while the list changes. When it
# doesn't, nothing errors: the page just jumps — a few dozen pixels, or all the
# way to the top. So this builds the app, uses every control on the plants
# index, a region page and the wildlife index at phone and laptop width, and
# fails on any frame where the control moved.
#
# `npm run scroll:check` is the same command locally, after `npm run build`.
name: Scroll position

on:
  pull_request:
    paths:
      - "app/src/**"
      - "app/index.html"
      - "app/vite.config.ts"
      - "app/scripts/check-scroll.mjs"
      - "app/package.json"
      - ".github/workflows/scroll.yml"

permissions:
  contents: read

jobs:
  check:
    name: Controls keep their place
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /
        run: npm run build

      - name: Use every view control
        working-directory: app
        run: npm run scroll:check
