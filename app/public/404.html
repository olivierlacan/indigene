<!doctype html>
<!--
  GitHub Pages serves this for any path that isn't a real file — which is
  exactly what a canonical plant URL like /plants/quercus-alba is. The app is
  a single page routed on the hash, so this bounces the path into the
  equivalent hash route (main.ts normalizes the rest). location.replace keeps
  this 404 out of the back button.

  The site is served from the root of its own domain, so the whole path is the
  route. If it ever moved back under a subpath (a *project* Pages site lives
  under /<repo>/), the leading segment would have to be kept as the base here
  instead of dropped into the hash.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Indigene</title>
    <script>
      var rest = location.pathname.split("/").filter(Boolean).join("/");
      location.replace("/" + (rest ? "#/" + rest : "") + location.search);
    </script>
  </head>
  <body>
    <p>Taking you to the plant… <a href="/">Indigene home</a></p>
  </body>
</html>
