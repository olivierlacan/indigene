<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- The header's own green, per theme, so the strip iOS paints above an
         installed app matches the header underneath it instead of being a
         third green nobody chose. Keep these in step with `--brand` in
         src/styles.css. The bare one last, for anything that ignores `media`. -->
    <meta name="theme-color" content="#7ec894" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#175e33" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#175e33" />

    <!-- Is this an iOS Home Screen app? Answered here, in the head, before the
         page has been laid out once — which is the whole point of it living in
         a script tag instead of in the app.
         An installed app has no reload button, so the app draws its own
         pull-down gesture (src/components/pull-to-reload.ts). WebKit reads the
         colour behind an over-pull and works out which touches it can handle
         without asking us, and it does both while setting the page up. A page
         that changes the answer afterwards keeps the old one until some later
         re-render happens to refresh it — which is why the gesture used to do
         nothing on a page you had just opened, and start working once you had
         followed a couple of links.
         Only iOS: every other browser has a reload button of its own, and the
         green would be tinting toolbars on a page that isn't green.
         src/lib/standalone.ts reads the verdict back. -->
    <script>
      (function () {
        var ios =
          /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          // iPadOS 13+ sends a desktop Safari user agent. A Mac with a
          // touchscreen is the false positive this admits, and Apple doesn't
          // sell one.
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        // Both signals, because they cover different vintages: `standalone` is
        // Safari's own long-standing flag, `display-mode` the standard one it
        // grew later. Either is enough.
        var installed =
          navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (ios && installed) document.documentElement.dataset.homeScreen = "";
      })();
    </script>

    <meta
      name="description"
      content="Stand in a spot, and find native plants that will actually thrive there — ranked by what they do for the local ecosystem."
    />
    <title>Indigene — native plants for exactly where you stand</title>
    <link rel="canonical" href="https://indigene.app/" />

    <!-- The app is one page in two languages, and `?lang=` is what pins a link
         to one of them (see lib/i18n.ts). These tell a search engine that, so
         it can offer the French page to a French searcher instead of ranking
         one language and hiding the other.

         These are the *root* page's alternates. Every other page now has its
         own file with its own set, written by scripts/prerender.mjs at build
         time. x-default is the bare URL, where detection picks the language. -->
    <link rel="alternate" hreflang="en" href="https://indigene.app/?lang=en" />
    <link rel="alternate" hreflang="fr" href="https://indigene.app/?lang=fr" />
    <link rel="alternate" hreflang="x-default" href="https://indigene.app/" />

    <!-- Favicons. Modern browsers take the SVG and stay crisp at any size;
         favicon.ico is for the ones that only ever ask for /favicon.ico, and
         it holds the 16/32/48 rasters. All generated by scripts/gen-icons.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The share card: what Slack, iMessage, WhatsApp and the rest show when
         someone posts a link. These describe the *site*, which is exactly what
         this file is now — every shareable page gets its own copy of the built
         shell with its own words in place of these, written by
         scripts/prerender.mjs after `vite build`. Keep the two in step: that
         script strips this whole block from each copy and re-emits it, and it
         fails the build if a tag here has no counterpart there. og:image must
         be an absolute URL, hence the hardcoded origin (pinned by
         public/CNAME). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Indigene" />
    <meta property="og:url" content="https://indigene.app/" />
    <meta property="og:title" content="Indigene — native plants for exactly where you stand" />
    <meta
      property="og:description"
      content="Stand in a spot, and find native plants that will actually thrive there — ranked by what they do for the local ecosystem."
    />
    <meta property="og:image" content="https://indigene.app/og/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Indigene — native plants for exactly where you stand"
    />
    <!-- Stamped to the actual UI language on boot (components/chrome.ts); the
         static value is what an unfurler that doesn't run JS is served. -->
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="fr" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Indigene — native plants for exactly where you stand" />
    <meta
      name="twitter:description"
      content="Stand in a spot, and find native plants that will actually thrive there — ranked by what they do for the local ecosystem."
    />
    <meta name="twitter:image" content="https://indigene.app/og/share-card.png" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#main">Skip to main content</a>
    <header class="app-header">
      <!-- The brand is also the way home. Hover (or focus) it and a small
           story plays out around the name: a bee flies over to the seedling
           hunting for pollen, finds a leaf and nothing else, trudges back —
           and the moment its back is turned the seedling blooms, so it comes
           racing across to feed. Every piece of it is decoration, hidden from
           screen readers; the link's accessible name stays "Indigene". The
           choreography lives in styles.css (`bee-errand`). -->
      <h1 class="app-title">
        <a href="#/"
          ><span class="brand-plant" aria-hidden="true"
            ><span class="brand-seed">🌱</span
            ><span class="brand-bloom">🌼</span></span
          > Indigene<span class="brand-bee" aria-hidden="true"
            ><span class="brand-bee-body">🐝</span></span
          ></a
        >
      </h1>
      <button
        id="offline-badge"
        class="offline-badge"
        type="button"
        hidden
        aria-live="polite"
      >
        Offline — using saved data
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Sections">
        <a href="#/regions" data-section="regions" data-i18n="nav.regions">Regions</a>
        <a href="#/plants" data-section="plants" data-i18n="nav.plants">Plants</a>
        <a href="#/wildlife" data-section="wildlife" data-i18n="nav.wildlife">Wildlife</a>
        <!-- The app menu. It began as a Saved-locations dropdown (hence the
             bookmark it used to wear), but it is the only spare surface in a
             header measured to the pixel — so it now holds the things that
             don't deserve a tab of their own: your saved spots, and the way
             to language & units. A gear says "the rest of the app lives
             here"; a bookmark promised only one of the two. -->
        <div id="app-menu" class="nav-menu">
          <button
            type="button"
            class="nav-menu-btn"
            data-section="menu"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="app-menu-panel"
            aria-label="Menu"
          >
            <span aria-hidden="true">⚙️</span>
            <span class="nav-menu-label" data-i18n="nav.menu">Menu</span>
          </button>
          <div
            id="app-menu-panel"
            class="nav-menu-panel"
            role="menu"
            aria-label="Menu"
            hidden
          ></div>
        </div>
      </nav>
    </header>

    <!-- Progress rail: which step of the flow you are on. -->
    <nav class="steps" id="steps-rail" aria-label="Progress">
      <ol id="steps" class="steps-list"></ol>
    </nav>

    <main id="main" class="app-main" tabindex="-1"></main>

    <!-- Site-wide footer: static so it shows on every page, even if a render
         fails. %BASE_URL% is replaced by Vite at build time. -->
    <footer class="app-footer">
      <p id="footer-text">
        Open-source (MIT), built on public scientific data —
        <a href="#/sources">where our numbers come from</a>, and how sure we are
        of each one. <a href="#/about">About</a>.
        <a href="%BASE_URL%release-notes/">See what's new</a>.
        <a href="#/privacy">Privacy &amp; safety</a>.
      </p>
      <!-- Language & units — two links, because they are two settings. Written
           as one "English · Imperial" line they read as a single "locale"
           choice, which is exactly the pairing the app goes out of its way not
           to make (see components/prefs-controls.ts). Separate icons and
           separate targets say it without a word of explanation.

           The header's gear menu carries the same destination on every page;
           this stays because the footer is where a reader who has scrolled to
           the end goes looking for it. -->
      <p class="footer-prefs">
        <a href="#/settings/language" id="prefs-lang-link"
          ><span aria-hidden="true">🌐</span> <span id="prefs-lang">Language: English</span></a
        >
        <a href="#/settings/units" id="prefs-units-link"
          ><span aria-hidden="true">📏</span> <span id="prefs-units">Units: Imperial</span></a
        >
      </p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
