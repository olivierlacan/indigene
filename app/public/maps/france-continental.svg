<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 768" width="640" height="768" role="img">
<title>Where the Continental France region reaches</title>
<desc>The centre and east: Burgundy, Franche-Comté, Lorraine, Alsace and the Rhône valley — east of Paris, west of the Rhine, north of Provence and below the Alps. Boundary data: EEA Biogeographical Regions of Europe (2016), CC BY 4.0 © European Environment Agency.</desc>
