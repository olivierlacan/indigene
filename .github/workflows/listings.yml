# Ask every invasive-plant authority whether it still says what we print.
#
# A `listing` in `app/src/data/lookalikes.ts` is the one place the look-alike
# layer repeats somebody else's verdict — "Cal-IPC rates it High", "Category I",
# "Class C noxious weed" — and a reader who follows the link has to find that
# word. Two things rot it: a body re-scores a species (Cal-IPC revises its
# inventory, FISC republishes at least every two years, Washington added English
# holly in 2025), and a transcription error nobody spots because the claim looks
# plausible.
#
# The check needs open internet — cal-ipc.org, nwcb.wa.gov, gd.eppo.int,
# dcr.virginia.gov, floridainvasives.org and the conservatory PDFs are all
# refused by the local build sandbox's egress — so it gets the same treatment as
# `vernacular.yml` and `reconcile.yml`: a job on a GitHub runner, reporting a
# reviewable change rather than gating a build.
#
# What it catches:
#   1. **A disagreement** — the body's category is not the one we print. Fails
#      the job: the app is attributing a verdict to somebody who didn't give it.
#   2. **Silence** — the body answered nothing: the list moved, the species was
#      dropped from it, or the host is down. Also a failure, on the rule
#      `check-vernacular.mjs` set — an authority gone quiet behind a changed URL
#      is indistinguishable from a clean bill of health otherwise.
#
# Twice a year, because these lists are revised on the timescale of a legislative
# session or a council's review cycle, not weeks.
name: Verify invasive listings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 20 3,9 *" # 07:00 UTC on 20 March and 20 September

permissions:
  contents: read
  issues: write

concurrency:
  group: invasive-listings
  cancel-in-progress: false

jobs:
  verify:
    name: Ask each authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # the script loads the app's TS through Vite
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # continue-on-error so the report is written and read even when a listing
      # has moved — a maintainer needs to see *which* one, not just that one did.
      - name: Check listings against the bodies that issued them
        id: check
        continue-on-error: true
        working-directory: app
        run: npm run listings:check | tee "$RUNNER_TEMP/listings.txt"

      - name: Read the report
        id: report
        if: always()
        run: |
          {
            echo "text<<REPORT_EOF"
            cat "$RUNNER_TEMP/listings.txt" 2>/dev/null || echo "_(no report written)_"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue when a listing has moved
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "An invasive listing no longer says what we print",
              body: [
                "One of the `listing` rows in `app/src/data/lookalikes.ts` is out of step",
                "with the body it cites.",
                "",
                "**Disagrees** means we attribute a category to somebody who now gives a",
                "different one — fix the row, and the `level` it maps to. **Silent** means",
                "the authority answered nothing: the list moved, the species came off it, or",
                "the host was down. Silence is a failure on purpose; a check that has stopped",
                "checking looks exactly like a clean bill of health.",
                "",
                "```",
                report,
                "```",
                "",
                "---",
                "_Generated by [Claude Code](https://claude.ai/code)_",
              ].join("\n"),
            });
        env:
          REPORT: ${{ steps.report.outputs.text }}

      - name: Fail if any listing disagrees or went silent
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::At least one invasive listing is no longer backed by the body it cites."
          exit 1
