# Reminds every PR to carry its changelog entry, since the public "What's new"
# page is compiled from the changelog (see CHANGELOG.md's header for the writing
# rules). Reviewing the entry in the PR is how release notes get reviewed before
# they're published.
#
# The entry is a file of its own under `changelog.d/` — one entry, one file, so
# two branches never write the same lines (changelog.d/README.md says why).
# Editing CHANGELOG.md directly still counts: that's how a version is cut.
#
# Not every change is notable: apply the `skip-changelog` label (screenshots,
# CI plumbing, typo fixes) and this check passes without an entry.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  entry:
    name: Entry for this PR
    runs-on: ubuntu-latest
    steps:
      - name: Skip via label
        if: contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: echo "skip-changelog label applied — no entry required."

      # For pull_request events HEAD is the test merge of the PR into its
      # base, so `HEAD^1 → HEAD` is exactly what this PR changes. Depth 2
      # makes that first parent available.
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        with:
          fetch-depth: 2

      - name: Check that the PR carries an entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -E '^changelog\.d/.+\.md$' | grep -qvx 'changelog.d/README.md'; then
            echo "Entry added under changelog.d/ — thank you."
          elif echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated — thank you."
          else
            echo "::error::This PR carries no changelog entry. Add one as changelog.d/<your-branch>.md — plain words, published as-is on the What's-new page (see changelog.d/README.md) — or apply the 'skip-changelog' label if nothing notable changed."
            exit 1
          fi

      - name: Verify the changelog still compiles
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        working-directory: app
        run: node scripts/build-release-notes.mjs --out /tmp/release-notes-check.html
