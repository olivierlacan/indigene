# Ask GloBI whether it can give the United States what the Gaytán matrix gave
# Europe: a citable, machine-readable count of the Lepidoptera that raise their
# caterpillars on a plant.
#
# **Why this is a job and not a build step.** The probe needs open internet —
# api.globalbioticinteractions.org answers 403 to the local build sandbox's
# egress — which is the same situation `reconcile.yml` and `vernacular.yml` are
# in, so it gets the same treatment: a separate job on a runner, producing a
# reviewable data change rather than a build artifact.
#
# **What it does not do.** It builds nothing and changes no shipped number. It
# answers the five questions in `app/scripts/probe-globi.mjs` and commits the
# snapshot, so the answer is on the record and reviewable in a diff. The gate is
# Q2 — whether a larval host can be told apart from an adult nectaring — and
# until that has a verdict written into `data/sources/globi/README.md` §2,
# nothing should be designed on top of this source. See
# `docs/us-host-counts-plan.md`.
#
# Manual only, for now. There is no schedule because there is nothing yet
# depending on the answer staying fresh — add one when a builder ships.
name: US host counts (GloBI probe)

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip the calibration pass (faster, less informative)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: us-host-counts
  cancel-in-progress: false

jobs:
  probe:
    name: Probe GloBI & snapshot what it said
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` — the probe is dependency-free on purpose (built-in fetch),
      # so it runs anywhere a human might want to run it by hand.
      - name: Probe
        id: probe
        run: |
          node app/scripts/probe-globi.mjs ${{ inputs.quick && '--quick' || '' }} \
            | tee "$RUNNER_TEMP/globi-probe.txt"

      - name: Report to the run summary
        if: always()
        run: |
          {
            echo "### GloBI probe"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/globi-probe.txt" 2>/dev/null || echo "(no output — the probe failed before printing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a PR with the snapshot
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: globi-probe
          title: "GloBI probe: what it answered today"
          commit-message: |
            Record what GloBI answered

            Snapshot from app/scripts/probe-globi.mjs. Nothing shipped depends
            on this yet — the gate is Q2, whether a larval host can be told
            apart from an adult nectaring. Read the verdict in the run summary
            and write it into data/sources/globi/README.md §2.
          add-paths: data/sources/globi/probe.json
          labels: skip-changelog
          body: |
            Automated snapshot of what GloBI answered, from
            `app/scripts/probe-globi.mjs`. **No shipped number changes.**

            The question this is here to settle is **Q2** — whether a larval
            host can be told apart from an adult nectaring. `hostLepCount`
            claims *"this many butterflies and moths raise their caterpillars on
            this plant"*, and `docs/host-counts-plan.md` §4.3 requires that the
            source actually record that claim before anything is designed around
            it.

            **To review:** read Q2's verdict in the run summary, then write it
            into `data/sources/globi/README.md` §2 and
            `docs/us-host-counts-plan.md`. If Q2 failed, say so there and close
            this line of work — the fallback is the Tallamy primary literature,
            already flagged in `PROJECT_BRIEF.md`.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
