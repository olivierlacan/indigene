  .cover { fill: #175e33; fill-opacity: 0.45; stroke: #0d3d20; stroke-width: 2; stroke-linejoin: round; }
  .cover-box { fill: #175e33; fill-opacity: 0.26; stroke: #0d3d20; stroke-width: 2;
               stroke-dasharray: 9 7; stroke-linejoin: round; }
